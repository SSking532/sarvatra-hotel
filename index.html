<!DOCTYPE html>
<html>
<head>
  <title>Sarvatra</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>

body {
  margin: 0;
  font-family: 'Poppins', 'Segoe UI', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
              url("background.png") no-repeat center center fixed;
  background-size: cover;
  color: white;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.logo img {
  height: 55px;
}

.title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 3px;
}

.links a {
  color: white;
  margin-left: 30px;
  text-decoration: none;
  font-size: 18px;
  position: relative;
}

.links a::after {
  content: '';
  position: absolute;
  width: 0%;
  height: 2px;
  background: cyan;
  left: 0;
  bottom: -5px;
  transition: 0.3s;
}

.links a:hover::after {
  width: 100%;
}

/* HERO */
.hero {
  text-align: center;
  margin-top: 120px;
  animation: fadeIn 1.5s ease;
}

.hero h1 {
  font-size: 60px;
  text-shadow: 0 0 25px rgba(0,255,255,0.8);
}

.hero p {
  font-size: 22px;
  opacity: 0.9;
}

/* GLASS CARD */
.graph {
  width: 75%;
  height: 200px;
  margin: 60px auto;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}

/* CHATBOT */
.chatbot-icon {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 80px;
  cursor: pointer;
  transition: 0.3s;
  filter: drop-shadow(0 0 10px cyan);
}

.chatbot-icon:hover {
  transform: scale(1.15) rotate(5deg);
}

.chatbox {
  position: fixed;
  bottom: 110px;
  right: 25px;
  width: 340px;
  background: rgba(30,30,30,0.9);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  display: none;
  flex-direction: column;
  box-shadow: 0 0 25px rgba(0,255,255,0.4);
  overflow: hidden;
}

.chat-header {
  padding: 14px;
  background: linear-gradient(45deg, cyan, #00bcd4);
  color: black;
  font-weight: bold;
  text-align: center;
}

.chat-body {
  height: 260px;
  overflow-y: auto;
  padding: 12px;
  font-size: 14px;
}

.chat-body .user {
  text-align: right;
  margin: 6px;
  color: #00e5ff;
}

.chat-body .bot {
  text-align: left;
  margin: 6px;
  color: #fff;
}

.chat-input {
  display: flex;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.chat-input input {
  flex: 1;
  padding: 12px;
  border: none;
  background: transparent;
  color: white;
}

.chat-input button {
  background: cyan;
  border: none;
  padding: 12px;
  cursor: pointer;
}

/* ANIMATION */
@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

  </style>
</head>

<body>

<nav>
  <div class="logo"><img src="logo.png"></div>
  <div class="title">SARVATRA</div>
  <div class="links">
    <a href="#">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
  </div>
</nav>

<div class="hero">
  <h1>Welcome to Sarvatra</h1>
  <p>By Shaurya Industries ✨</p>
</div>

<div class="graph">
  📊 Live Hotel Analytics Coming Soon
</div>

<img src="chatbot.png" class="chatbot-icon" onclick="toggleChat()">

<div class="chatbox" id="chatbox">
  <div class="chat-header">Sarvatra Assistant</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Ask something...">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>
<script>
function toggleChat() {
  let box = document.getElementById("chatbox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
}

function sendMessage() {
    const input = document.getElementById('userInput');
    const chat = document.getElementById('chatBody');
    const message = input.value.trim();

    if (!message) return;
    //Show user message
    chat.innerHTML += '<div class="user">You:'+ message+'</div>';
    input.value='';

    //Send to flask backend
    fetch('/chat',{
        method:'POST',
        headers:{'Content-Type': 'application/json'},
        body: JSON.stringify({message: message})
    })

    .then(response=>response.json())
    .then(data=> {
        chat.innerHTML+='<div class="bot">Bot:' + data.response + '</div>'
        chat.scrollTop=chat.scrollHeight;
    });

}
</script>
</body>
</html>
